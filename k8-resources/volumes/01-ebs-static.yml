apiVersion: v1
kind: persistent volume
metadata:
  name: ebs-static
spec: 
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 20Gi
  csi:
   driver: ebs.csi.aws.com
   fsType: ext4
   VolumeHandle: vol-072a8f44214a23f64  ##give the volume on ec2-instance-node(20-gb)


##git add. ; git commit -m "ebs" ; git push origin main
##cd k8-resource/volumes
##kubectl apply -f 01-ebs-static.yml
##kubectl get pv --> see the volume.



###pvc - peersisitent volume claim
##pvc--> it is claiming resource of the storage i.e pv
#you can create the lables to the nodes,use those labels as node selectors inside pod.

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-static
spec:
  storageClassName: "" # Empty string must be explicitly set otherwise default StorageClass will be set
  volumeName: ebs-static
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 15Gi


